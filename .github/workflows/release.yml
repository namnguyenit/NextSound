name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package
        run: ./packaging/build-deb.sh

      - name: Verify package
        run: (cd dist && sha256sum --check SHA256SUMS)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/nextsound_0.1.0-1_amd64.deb \
              dist/SHA256SUMS --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/nextsound_0.1.0-1_amd64.deb \
              dist/SHA256SUMS \
              --title "NextSound ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
